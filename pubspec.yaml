# Native Splash Screen Configuration
flutter_native_splash:
  color: "#000000"
  image: assets/images/icon.png
  color_dark: "#000000"
  image_dark: assets/images/icon.png
  
  android_12:
    color: "#000000"
    image: assets/images/icon.png
    color_dark: "#000000"
    image_dark: assets/images/icon.png
  
  web: false
  android: true
  ios: true


# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  
  # Android adaptive icon
  adaptive_icon_background: "#000000"  # Color de fondo negro
  adaptive_icon_foreground: "assets/images/icon.png"
  
  # Web
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  
  # Windows
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 256
  
  # macOS
  macos:
    generate: true
    image_path: "assets/images/icon.png"
  
  # Linux
  linux:
    generate: true
    image_path: "assets/images/icon.png"


