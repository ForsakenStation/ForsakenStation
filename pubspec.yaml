name: forsaken
description: "A modern multi-platform emulator frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  shared_preferences: ^2.5.4
  window_manager: ^0.5.1
  file_picker: ^10.3.10
  google_fonts: ^9.0.0
  xml: ^6.6.1
  archive: ^4.5.1
  gamepads: ^0.1.12
  pdfrx: ^2.6.5
  crypto: ^3.0.7
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  # Web-specific dependencies
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  asset_fill: ^2.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  fake_async: ^1.3.1
  test: ^1.25.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/platform_info.json
    - assets/configs/
    - assets/data/
    - assets/images/
    - assets/theme/
    - assets/theme/images/
    - assets/theme/images/backgrounds/
    - assets/theme/images/clogos/
    - assets/theme/images/logos/
    - assets/theme/images/systems/


# Native Splash Screen Configuration
flutter_native_splash:
  color: "#000000"
  image: assets/images/icon.png
  color_dark: "#000000"
  image_dark: assets/images/icon.png
  
  android_12:
    color: "#000000"
    image: assets/images/icon.png
    color_dark: "#000000"
    image_dark: assets/images/icon.png
  
  web: false
  android: true
  ios: true


# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  
  # Android adaptive icon
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/icon.png"
  
  # Web
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  
  # Windows
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 256
  
  # macOS
  macos:
    generate: true
    image_path: "assets/images/icon.png"
  
  # Linux
  linux:
    generate: true
    image_path: "assets/images/icon.png"


