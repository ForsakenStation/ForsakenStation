name: forsaken
description: "A frontend Emulator"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.2.3
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  shared_preferences: ^2.5.4
  window_manager: ^0.5.1
  file_picker: 10.3.8
  google_fonts: ^8.0.0
  xml: ^6.6.1
  archive: ^4.0.7
  gamepads: ^0.1.9
  pdfrx: ^2.2.24
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  asset_fill: ^2.0.0

