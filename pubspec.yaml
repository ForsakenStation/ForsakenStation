name: forsaken
description: "A frontend Emulator"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.2.3
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  shared_preferences: ^2.5.4
  window_manager: ^0.5.1
  file_picker: ^10.3.8
  google_fonts: ^8.0.0
  xml: ^6.6.1
  archive: ^4.0.7
  gamepads: ^0.1.9
  pdfrx: ^2.2.24
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/config.json
    - assets/configs/
    - assets/data/platforms_info.json
    - assets/images/
    - assets/theme/images/logos/
    - assets/theme/images/clogos/
    - assets/theme/images/backgrounds/
    - assets/theme/images/systems/

# Native Splash Screen Configuration
flutter_native_splash:
  color: "#000000"
  image: assets/images/icon.png
  color_dark: "#000000"
  image_dark: assets/images/icon.png
  
  android_12:
    color: "#000000"
    image: assets/images/icon.png
    color_dark: "#000000"
    image_dark: assets/images/icon.png
  
  web: false
  android: true
  ios: true


# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  
  # Android adaptive icon
  adaptive_icon_background: "#000000"  # Color de fondo negro
  adaptive_icon_foreground: "assets/images/icon.png"
  
  # Web
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  
  # Windows
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 256
  
  # macOS
  macos:
    generate: true
    image_path: "assets/images/icon.png"
  
  # Linux
  linux:
    generate: true
    image_path: "assets/images/icon.png"


