<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Forsaken Emulator - Retro Gaming in Your Browser">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Forsaken Emulator">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Forsaken Emulator</title>
  <link rel="manifest" href="manifest.json">

  <!-- EmulatorJS styles will be loaded dynamically from CDN -->

  <!-- Viewport for responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
</head>
<body>
  <!-- Forsaken EmulatorJS Bridge - Load before Flutter -->
  <script src="emulatorjs/forsaken_bridge.js"></script>
  
  <!-- Verify script loaded -->
  <script>
    if (typeof ForsakenEmulatorJS !== 'undefined') {
      console.log('✅ ForsakenEmulatorJS loaded successfully');
      console.log('✅ createForsakenEmulator available:', typeof createForsakenEmulator);
    } else {
      console.error('❌ ForsakenEmulatorJS not loaded!');
    }
  </script>

  <!-- Flutter Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Web-specific initialization -->
  <script>
    // EmulatorJS configuration - CDN path is set in forsaken_bridge.js
    // Debug mode can be enabled here if needed
    window.EJS_DEBUG_XX = false;
    
    window.addEventListener('load', function() {
      console.log('Forsaken Emulator Web initialized');
      console.log('EmulatorJS CDN: https://cdn.emulatorjs.org/stable/data/');
    });
  </script>
</body>
</html>
