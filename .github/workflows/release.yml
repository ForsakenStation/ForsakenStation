  build-windows:
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        run: >
          flutter build windows --release
          --build-name="${{ needs.prepare.outputs.build_name }}"
          --build-number="${{ github.run_number }}"

      - name: Package Windows (.zip)
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "dist/artifacts" | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\artifacts\Forsaken-$version-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/artifacts/*

  release:
    needs: [prepare, build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
