name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0) for manual build test'
        required: false
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_name: ${{ steps.meta.outputs.build_name }}
    steps:
      - name: Determine version metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.tag }}"
            if [ -z "$VERSION" ]; then
              VERSION="v0.0.0-dev"
            fi
          fi
          # Strip leading 'v' and any '-prerelease' suffix for --build-name (must be X.Y.Z)
          RAW="${VERSION#v}"
          BUILD_NAME="${RAW%%-*}"
          if ! [[ "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            BUILD_NAME="0.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-linux:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libudev-dev \
            libmpv-dev \
            mpv

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux release
        run: >
          flutter build linux --release
          --build-name="${{ needs.prepare.outputs.build_name }}"
          --build-number="${{ github.run_number }}"

      - name: Package Linux portable (.tar.gz)
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUNDLE_DIR="build/linux/x64/release/bundle"
          STAGING="dist/Forsaken-${VERSION}-linux-x64"
          mkdir -p "$STAGING/lib" dist/artifacts
          cp -r "$BUNDLE_DIR"/* "$STAGING/"

          # Bundle libmpv and FFmpeg libraries for portable execution
          for lib in libmpv.so libavcodec.so libavformat.so libavutil.so libswscale.so libswresample.so; do
            LIB_PATH=$(ldconfig -p | grep -F "$lib" | head -n1 | awk '{print $NF}')
            if [ -n "$LIB_PATH" ] && [ -f "$LIB_PATH" ]; then
              cp -L "$LIB_PATH" "$STAGING/lib/"
            fi
          done

          cat > "$STAGING/forsaken.sh" << 'EOF'
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          exec "$DIR/emulator" "$@"
          EOF
          chmod +x "$STAGING/forsaken.sh"

          tar -C dist -czf "dist/artifacts/Forsaken-${VERSION}-linux-x64.tar.gz" "Forsaken-${VERSION}-linux-x64"

      - name: Package Linux AppImage
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="dist/Forsaken.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
            dist/artifacts

          cp -r "$BUNDLE_DIR"/* "$APPDIR/usr/bin/"

          for lib in libmpv.so libavcodec.so libavformat.so libavutil.so libswscale.so libswresample.so libavfilter.so; do
            LIB_PATH=$(ldconfig -p | grep -F "$lib" | head -n1 | awk '{print $NF}')
            if [ -n "$LIB_PATH" ] && [ -f "$LIB_PATH" ]; then
              cp -L "$LIB_PATH" "$APPDIR/usr/lib/" || true
            fi
          done

          cat > "$APPDIR/com.forsaken.emulator.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Forsaken
          Comment=Multi-platform retro gaming frontend
          Exec=emulator
          Icon=com.forsaken.emulator
          Categories=Game;Emulator;
          StartupWMClass=com.forsaken.emulator
          Terminal=false
          EOF
          cp "$APPDIR/com.forsaken.emulator.desktop" "$APPDIR/usr/share/applications/com.forsaken.emulator.desktop"

          if [ -f "assets/images/icon.png" ]; then
            cp "assets/images/icon.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/com.forsaken.emulator.png"
            cp "assets/images/icon.png" "$APPDIR/com.forsaken.emulator.png"
          fi

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/emulator" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q -O /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool.AppImage \
            "$APPDIR" "dist/artifacts/Forsaken-${VERSION}-linux-x64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/artifacts/*

