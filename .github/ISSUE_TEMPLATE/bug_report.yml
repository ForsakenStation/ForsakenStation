name: Bug Report
description: Report a crash, visual glitch, or unexpected behavior in Forsaken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the fields below so we can reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Press '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What you expected to happen and what actually happened.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System / Platform
      options:
        - Linux (AppImage / Portable)
        - Linux (Source build)
        - macOS
        - Windows
        - Android
        - iOS
        - Web
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Forsaken Version
      description: e.g. v0.1.0 or commit hash
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any relevant console output, DebugService logs, or attach screenshots.
      render: shell
